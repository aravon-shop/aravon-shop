<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Create User – Aravon Admin</title>

  <style>
    body { margin:0; font-family:Arial, sans-serif; background:#f5f5f5; display:flex; height:100vh; }

    /* SIDEBAR */
    .sidebar {
      width:250px;
      background:#fff;
      padding:20px;
      border-right:1px solid #ddd;
      box-sizing:border-box;
    }

    .sidebar h2 { margin-bottom:20px; }

    .sidebar a {
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:10px 12px;
      margin-bottom:8px;
      text-decoration:none;
      color:#333;
      border-radius:20px;
      transition:0.2s;
      font-size:14px;
    }

    .sidebar a:hover { background:#f1f3f4; }
    .sidebar a.active { background:#d2e3fc; color:#174ea6; }

    .badge {
      background:#ea4335;
      color:white;
      padding:2px 8px;
      border-radius:12px;
      font-size:11px;
    }

    .logout-btn {
      background:#333;
      color:#fff;
      padding:10px;
      border:none;
      border-radius:20px;
      cursor:pointer;
      width:100%;
      font-size:14px;
      margin-top:20px;
      display:block;
      text-align:center;
    }

    /* MAIN */
    .main {
      flex:1;
      padding:30px;
      overflow-y:auto;
      background:#fff;
    }

    .main h2 {
      margin-top:0;
      font-size:24px;
      font-weight:600;
    }

    .card {
      background:#fff;
      padding:20px;
      border-radius:12px;
      border:1px solid #ddd;
      max-width:600px;
    }

    .form-row {
      display:flex;
      gap:12px;
      margin-bottom:12px;
    }

    .form-group {
      flex:1;
      display:flex;
      flex-direction:column;
      font-size:14px;
    }

    .form-group label {
      margin-bottom:4px;
      color:#555;
    }

    .form-group input,
    .form-group select {
      padding:8px 10px;
      border-radius:8px;
      border:1px solid #ccc;
      font-size:14px;
    }

    .form-actions {
      margin-top:20px;
      display:flex;
      gap:10px;
    }

    .primary-btn {
      background:#174ea6;
      color:#fff;
      border:none;
      border-radius:20px;
      padding:10px 18px;
      font-size:14px;
      cursor:pointer;
    }

    .primary-btn:hover {
      background:#0f3c85;
    }

    .secondary-btn {
      background:#f1f3f4;
      color:#333;
      border:none;
      border-radius:20px;
      padding:10px 18px;
      font-size:14px;
      cursor:pointer;
    }

    .secondary-btn:hover {
      background:#e0e0e0;
    }
  </style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
  <h2>Admin Panel</h2>

  <a href="../dashboard/admin-dashboard.html">
    <span>Dashboard</span>
  </a>

  <a href="../orders/admin-orders.html">
    <span>Orders</span>
    <span class="badge" id="ordersCount">0</span>
  </a>

  <a href="users-list.html" class="active">
    <span>Users</span>
    <span class="badge" id="usersCount">0</span>
  </a>

  <a href="../inventory/admin-inventory.html">
    <span>Inventory</span>
    <span class="badge" id="inventoryCount">0</span>
  </a>

  <a href="../website-builder/product-page-editor.html">
    <span>Website Builder</span>
  </a>

  <a href="../settings/admin-settings.html">
    <span>Settings</span>
  </a>

  <a href="../payment/payment-setting.html">
    <span>Payment</span>
    <span class="badge" id="paymentCount">0</span>
  </a>

  <a href="../messages/admin-messages.html">
    <span>Messages</span>
    <span class="badge" id="messagesCount">0</span>
  </a>

  <button class="logout-btn">Logout</button>
</div>

<!-- MAIN -->
<div class="main">
  <h2>Create User</h2>

<button class="sync-btn" onclick="goBackToUsers()">← Back to Users List</button>

<div class="form-group" style="margin-bottom:15px;">
  <label for="userImage">User Image</label>
  <input id="userImage" type="file" accept="image/*" onchange="previewImage(event)">
  <img id="imagePreview" style="width:80px; height:80px; border-radius:50%; margin-top:10px; display:none; object-fit:cover;">
</div>

  <div class="card">
    <form id="createUserForm">
      <div class="form-row">
        <div class="form-group">
          <label for="firstName">First name</label>
          <input id="firstName" type="text" required>
        </div>
        <div class="form-group">
          <label for="lastName">Last name</label>
          <input id="lastName" type="text" required>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="email">Email</label>
          <input id="email" type="email" required>
        </div>
        <div class="form-group">
          <label for="phone">Phone (optional)</label>
          <input id="phone" type="text">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="country">Country</label>
          <input id="country" type="text" required>
        </div>
        <div class="form-group">
          <label for="city">City</label>
          <input id="city" type="text" required>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="street">Street</label>
          <input id="street" type="text">
        </div>
        <div class="form-group">
          <label for="houseNumber">House number</label>
          <input id="houseNumber" type="text">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="postalCode">Postal code</label>
          <input id="postalCode" type="text">
        </div>
        <div class="form-group">
          <label for="signupDate">Signup date</label>
          <input id="signupDate" type="text" readonly>
        </div>
      </div>

      <div class="form-actions">
        <button type="submit" class="primary-btn">Save User</button>
        <button type="button" class="secondary-btn" onclick="goBack()">Cancel</button>
      </div>
    </form>
  </div>
</div>

<script>
/* ⭐ Helper: load data from localStorage */
function loadData(key, fallback) {
  const raw = localStorage.getItem(key);
  if (!raw) return fallback;
  try {
    return JSON.parse(raw);
  } catch {
    return fallback;
  }
}

function goBackToUsers() {
  window.location.href = "users-list.html";
}

/* ⭐ Existing real-time collections */
let products = loadData("inventoryProducts", []);
let orders = loadData("adminOrders", []);
let payments = loadData("adminPayments", []);
let messages = loadData("adminMessages", []);

/* ⭐ Users collection (for create-user) */
let users = loadData("adminUsers", []);

/* ⭐ Update sidebar badges in real time */
function updateSidebarCounts() {
  document.getElementById("inventoryCount").innerText = products.length;
  document.getElementById("usersCount").innerText = users.length;
  document.getElementById("ordersCount").innerText = orders.length;
  document.getElementById("paymentCount").innerText = payments.length;
  document.getElementById("messagesCount").innerText = messages.length;
}

/* ⭐ Set default signup date */
function setDefaultSignupDate() {
  const input = document.getElementById("signupDate");
  const now = new Date();
  const yyyy = now.getFullYear();
  const mm = String(now.getMonth() + 1).padStart(2, "0");
  const dd = String(now.getDate()).padStart(2, "0");
  const hh = String(now.getHours()).padStart(2, "0");
  const min = String(now.getMinutes()).padStart(2, "0");
  input.value = `${yyyy}-${mm}-${dd} ${hh}:${min}`;
}

/* ⭐ Generate UID */
function generateUid() {
  const base = users.length;
  return `UID-${base.toString().padStart(5, "0")}`;
}

function previewImage(event) {
  const file = event.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = function(e) {
    const img = document.getElementById("imagePreview");
    img.src = e.target.result;
    img.style.display = "block";
  };
  reader.readAsDataURL(file);
}


/* ⭐ Handle form submit: real-time add user */
document.getElementById("createUserForm").addEventListener("submit", function (e) {
  e.preventDefault();

  const newUser = {
    uid: generateUid(),
    firstName: document.getElementById("firstName").value.trim(),
    lastName: document.getElementById("lastName").value.trim(),
    email: document.getElementById("email").value.trim(),
    image: document.getElementById("imagePreview").src || "",
    phone: document.getElementById("phone").value.trim(),
    country: document.getElementById("country").value.trim(),
    city: document.getElementById("city").value.trim(),
    street: document.getElementById("street").value.trim(),
    housenumber: document.getElementById("houseNumber").value.trim(),
    postalCode: document.getElementById("postalCode").value.trim(),
    signupDate: document.getElementById("signupDate").value.trim()
  };

  users.push(newUser);
  localStorage.setItem("adminUsers", JSON.stringify(users));

  updateSidebarCounts();



  // Later: replace this with Firestore write
  // e.g. await setDoc(doc(db, "users", newUser.uid), newUser);

  window.location.href = "users-list.html";
});

/* ⭐ Cancel button */
function goBack() {
  window.location.href = "users-list.html";
}

/* ⭐ Initial setup */
setDefaultSignupDate();
updateSidebarCounts();
</script>

</body>
</html>
