<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Firestore Sync – Aravon Shop</title>

  <style>
    body { margin:0; font-family:Arial, sans-serif; background:#f5f5f5; display:flex; height:100vh; }

    .sidebar {
      width:250px;
      background:#fff;
      padding:20px;
      border-right:1px solid #ddd;
      box-sizing:border-box;
    }

    .sidebar h2 { margin-bottom:20px; }

    .sidebar a {
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:10px 12px;
      margin-bottom:8px;
      text-decoration:none;
      color:#333;
      border-radius:20px;
      transition:0.2s;
      font-size:14px;
    }

    .sidebar a:hover { background:#f1f3f4; }
    .sidebar a.active { background:#d2e3fc; color:#174ea6; }

     .badge {
      background:#ea4335;
      color:white;
      padding:2px 8px;
      border-radius:12px;
      font-size:11px;
    }

    .logout-btn {
      background:#333;
      color:#fff;
      padding:10px;
      border:none;
      border-radius:20px;
      cursor:pointer;
      width:100%;
      font-size:14px;
      margin-top:20px;
      display:block;
      text-align:center;
    }

    .main {
      flex:1;
      padding:30px;
      overflow-y:auto;
    }

    .card {
      background:#fff;
      padding:20px;
      border-radius:12px;
      border:1px solid #ddd;
      margin-bottom:20px;
      max-width:600px;
    }

    .btn {
      padding:12px 18px;
      background:#174ea6;
      color:#fff;
      border:none;
      border-radius:20px;
      cursor:pointer;
      font-size:15px;
      margin-top:15px;
    }

    .btn:hover { background:#0f3c85; }
  </style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
  <h2>Admin Panel</h2>

<a href="../dashboard/admin-dashboard.html" class="active">
    <span>Dashboard</span>
  </a>

  <a href="../orders/admin-orders.html">
    <span>Orders</span>
    <span id="orderCountBadge" class="badge">0</span>
  </a>

  <a href="../users/users-list.html">
    <span>Users</span>
    <span id="usersCountBadge" class="badge">0</span>
  </a>

  <a href="../inventory/admin-inventory.html">
    <span>Inventory</span>
    <span id="productCountBadge" class="badge">0</span>
  </a>

  <a href="../website-builder/product-page-editor.html">
     <span>Website Builder</span>
  </a>

  <a href="../settings/admin-settings.html">
     <span>Settings</span>
  </a>

  <a href="../payment/payment-setting.html">
    <span>Payment</span>
    <span id="paymentCountBadge" class="badge">0</span>
  </a>

  <a href="../messages/admin-messages.html">
    <span>Messages</span>
    <span id="messageCountBadge" class="badge">0</span>
  </a>


  <button class="logout-btn" onclick="logoutAdmin()">Logout</button>
</div>

<!-- MAIN -->
<div class="main">
  <div class="card">
    <h2>Enable Firestore Sync</h2>

    <p>This will upload your entire shop (products, orders, users, payments, messages) into Firestore.</p>

    <button class="btn" onclick="enableFirestoreSync()">Upload Entire Shop to Firestore</button>

    <p id="status" style="margin-top:15px; font-weight:bold;"></p>
  </div>
</div>

<script type="module">
  import { auth, db } from "/js/firebase.js";
  import { signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { collection, addDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ⭐ REAL-TIME BADGES */
  onSnapshot(collection(db, "orders"), snap => {
    document.getElementById("orderCountBadge").innerText = snap.size;
  });

  onSnapshot(collection(db, "users"), snap => {
    document.getElementById("usersCountBadge").innerText = snap.size;
  });

  onSnapshot(collection(db, "products"), snap => {
    document.getElementById("productCountBadge").innerText = snap.size;
  });

  onSnapshot(collection(db, "payments"), snap => {
    document.getElementById("paymentCountBadge").innerText = snap.size;
  });

  onSnapshot(collection(db, "conversations"), snap => {
    document.getElementById("messageCountBadge").innerText = snap.size;
  });

  window.logoutAdmin = () => {
    signOut(auth).then(() => window.location.href = "../auth/admin-login.html");
  };

  /* ⭐ MAIN FIRESTORE SYNC FUNCTION */
  window.enableFirestoreSync = async () => {
    const status = document.getElementById("status");
    status.textContent = "Uploading… please wait.";

    const collections = [
      ["products", "inventoryProducts"],
      ["orders", "adminOrders"],
      ["users", "adminUsers"],
      ["payments", "adminPayments"],
      ["conversations", "adminMessages"]
    ];

    try {
      for (const [firestoreName, localKey] of collections) {
        const data = JSON.parse(localStorage.getItem(localKey)) || [];

        for (const item of data) {
          await addDoc(collection(db, firestoreName), item);
        }
      }

      status.textContent = "✔ Upload complete! Your shop is now synced with Firestore.";
    } catch (err) {
      status.textContent = "❌ Error uploading: " + err.message;
    }
  };
</script>

</body>
</html>
